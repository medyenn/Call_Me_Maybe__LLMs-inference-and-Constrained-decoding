[project]
name = "call-me-maybe"
version = "1.5.0"
description = "Function calling via constrained decoding on a small LLM (42 curriculum project)."
requires-python = ">=3.10"

# pydantic/numpy: allowed and used by *our* code (src/).
# torch/transformers/huggingface-hub: NOT used anywhere in src/. They are
# required transitively because the provided llm_sdk package (read-only,
# copied in as-is per the subject) needs them internally to load and run
# Qwen3-0.6B. We never import them ourselves.
dependencies = [
    "pydantic>=2.13.4",
    "numpy>=1.26",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

# This repository is an application, not a library meant to be built and
# published as a wheel — `uv sync` should only resolve/install the
# dependencies above into a venv, not try to package src/ or llm_sdk/.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]
