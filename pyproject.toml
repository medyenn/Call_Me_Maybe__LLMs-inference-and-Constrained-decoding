[project]
name = "call-me-maybe"
version = "1.5.0"
description = "Function calling via constrained decoding on a small LLM (42 curriculum project)."
requires-python = ">=3.10"


dependencies = [
    "pydantic>=2.13.4",
    "numpy>=1.26",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
